name: klan-frontend-production

services:
  frontend:
    image: ${IMAGE_REF:?Set IMAGE_REF to the published image digest}
    restart: unless-stopped
    env_file:
      - path: ../runtime.env
        format: raw
    environment:
      KLAN_DOMAIN: :80
      API_UPSTREAM: api:3001
      FRONTEND_ROOT: /srv
    ports:
      - "127.0.0.1:8088:80"
    networks:
      - production
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/ | grep -q 'id=\"app\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  production:
    external: true
    name: klan-production
