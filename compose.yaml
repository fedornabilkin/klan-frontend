services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      KLAN_DOMAIN: ${KLAN_DOMAIN:-:80}
      API_UPSTREAM: ${API_UPSTREAM:-host.docker.internal:3001}
      FRONTEND_ROOT: /srv
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_HTTP_PORT:-8080}:80"
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_HTTPS_PORT:-8443}:443"
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_HTTPS_PORT:-8443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
