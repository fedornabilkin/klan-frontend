name: Production
run-name: Production · ${{ github.sha }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Проверки и статика
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Project/package-lock.json
      - run: npm ci
        working-directory: Project
      - name: Проверить приложение и собрать статику
        working-directory: Project
        run: |
          npm test
          npm run build
      - name: Проверить сценарии выкладки
        run: |
          for script in Deploy/*.sh; do bash -n "$script"; done
          shellcheck Deploy/*.sh
          node --test Deploy/*.test.mjs
      - name: Упаковать проверенную сборку
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: bash Deploy/package.sh Project/dist release
      - name: Сохранить архив и SHA256
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-${{ github.sha }}
          path: |
            release/frontend.tar.gz
            release/frontend.tar.gz.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  deploy:
    name: Статика в nginx
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: frontend-${{ github.sha }}
          path: release
      - name: Не выкатывать устаревший запуск
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "В main уже есть новый коммит. Запустите Production для актуальной main." >&2
            exit 1
          fi
      - name: Передать архив и проверить опубликованную версию
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: bash Deploy/deploy.sh release
