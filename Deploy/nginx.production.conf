# Install only after issuing the certificate; replace every klan.example.org.
# This file belongs in nginx's http context (e.g. sites-enabled on Debian/Ubuntu).
map $http_upgrade $klan_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name klan.example.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://klan.example.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name klan.example.org;

    ssl_certificate /etc/letsencrypt/live/klan.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/klan.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    root /var/www/klan;
    index index.html;

    location = /internal {
        return 404;
    }
    location ^~ /internal/ {
        return 404;
    }

    # A single trusted proxy reaches the API; static files never handle API requests.
    location ~ ^/(api|ws)(/|$) {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $klan_connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location = /deploy-version.txt {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /deploy-site.txt {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
